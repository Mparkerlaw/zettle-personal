<!DOCTYPE html>
<html lang="en" data-theme="aurora">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>My Workout Routine</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#05070e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="The Foundry" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <h1 id="app-title">My Workout Routine</h1>
      <p id="app-tagline" class="masthead-tagline"></p>
      <div class="header-controls">
        <div class="equip-toggle" id="equip-toggle">
          <button data-mode="home" class="equip-opt">🏠 Home</button>
          <button data-mode="gym" class="equip-opt">🏋️ Gym</button>
        </div>
      </div>
    </div>
  </header>

  <div id="nudge-banner" class="nudge-banner" hidden></div>

  <main id="main">
    <section id="view-routine" class="view active"></section>
    <section id="view-track" class="view"></section>
    <section id="view-progress" class="view"></section>
    <section id="view-body" class="view"></section>
  </main>

  <footer class="app-footer">
    <span id="last-backup" class="last-backup-note"></span>
    <button id="more-toggle" class="link-btn more-toggle" aria-expanded="false" aria-controls="footer-actions">Backup &amp; data ⋯</button>
    <div class="footer-actions" id="footer-actions" hidden>
      <button id="icloud-btn" class="link-btn">☁️ Save to iCloud</button>
      <button id="icloud-restore-btn" class="link-btn">☁️ Restore from iCloud</button>
      <button id="export-btn" class="link-btn">Export data</button>
      <button id="import-btn" class="link-btn">Import data</button>
    </div>
    <input id="import-file" type="file" accept="application/json" hidden />
  </footer>

  <!-- Exercise detail modal -->
  <div id="modal-root" class="modal-root" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal" role="dialog" aria-modal="true"></div>
  </div>

  <nav class="tabs" aria-label="Sections">
    <button class="tab active" data-view="routine"><span class="tab-glyph">☰</span>Menu</button>
    <button class="tab" data-view="track"><span class="tab-glyph">✎</span>Log</button>
    <button class="tab" data-view="progress"><span class="tab-glyph">◷</span>Progress</button>
    <button class="tab" data-view="body"><span class="tab-glyph">☗</span>Body</button>
  </nav>

  <!-- Floating rest timer -->
  <div id="rest-timer" class="rest-timer" hidden></div>

  <!-- Focus Mode (full-screen guided workout) -->
  <div id="focus-root" class="focus-root" hidden></div>

  <!-- PR celebration overlay -->
  <div id="celebrate-root" class="celebrate-root" hidden></div>
  <canvas id="confetti" class="confetti" hidden></canvas>

  <script src="routine.js"></script>
  <script src="app.js"></script>
</body>
</html>
